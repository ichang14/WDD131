<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Sun -->
  <circle cx="38" cy="38" r="13" fill="#F5A623"/>
  <!-- Sun rays -->
  <g stroke="#F5A623" stroke-width="2.5" stroke-linecap="round">
    <line x1="38" y1="20" x2="38" y2="15"/>
    <line x1="38" y1="56" x2="38" y2="61"/>
    <line x1="20" y1="38" x2="15" y2="38"/>
    <line x1="56" y1="38" x2="61" y2="38"/>
    <line x1="26" y1="26" x2="22" y2="22"/>
    <line x1="50" y1="50" x2="54" y2="54"/>
    <line x1="50" y1="26" x2="54" y2="22"/>
    <line x1="26" y1="50" x2="22" y2="54"/>
  </g>
  <!-- Back cloud (lighter) -->
  <circle cx="52" cy="52" r="12" fill="#B0C4DE"/>
  <circle cx="64" cy="56" r="10" fill="#B0C4DE"/>
  <circle cx="42" cy="58" r="9"  fill="#B0C4DE"/>
  <rect x="42" y="56" width="32" height="14" rx="0" fill="#B0C4DE"/>
  <!-- Front cloud (white) -->
  <circle cx="46" cy="46" r="11" fill="#E8F0F8"/>
  <circle cx="57" cy="49" r="9"  fill="#E8F0F8"/>
  <circle cx="38" cy="51" r="8"  fill="#E8F0F8"/>
  <rect x="38" y="49" width="28" height="13" rx="0" fill="#E8F0F8"/>
  <!-- Cloud outline -->
  <path d="M38 62 Q30 62 30 54 Q30 46 38 45 Q40 38 48 38 Q56 38 58 45 Q64 44 66 50 Q70 50 70 56 Q70 62 62 62 Z"
        fill="#D6E6F5" stroke="#9DBDD6" stroke-width="1"/>
  <!-- Snowflakes -->
  <g stroke="#6BAED6" stroke-width="2" stroke-linecap="round">
    <!-- Flake 1 -->
    <line x1="38" y1="70" x2="38" y2="80"/>
    <line x1="33" y1="75" x2="43" y2="75"/>
    <line x1="34" y1="71" x2="42" y2="79"/>
    <line x1="42" y1="71" x2="34" y2="79"/>
    <!-- Flake 2 -->
    <line x1="52" y1="70" x2="52" y2="80"/>
    <line x1="47" y1="75" x2="57" y2="75"/>
    <line x1="48" y1="71" x2="56" y2="79"/>
    <line x1="56" y1="71" x2="48" y2="79"/>
    <!-- Flake 3 -->
    <line x1="66" y1="70" x2="66" y2="80"/>
    <line x1="61" y1="75" x2="71" y2="75"/>
    <line x1="62" y1="71" x2="70" y2="79"/>
    <line x1="70" y1="71" x2="62" y2="79"/>
  </g>
  <!-- Snowflake dots -->
  <circle cx="38" cy="70" r="1.5" fill="#6BAED6"/>
  <circle cx="38" cy="80" r="1.5" fill="#6BAED6"/>
  <circle cx="52" cy="70" r="1.5" fill="#6BAED6"/>
  <circle cx="52" cy="80" r="1.5" fill="#6BAED6"/>
  <circle cx="66" cy="70" r="1.5" fill="#6BAED6"/>
  <circle cx="66" cy="80" r="1.5" fill="#6BAED6"/>
</svg>
