<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A visual album of Latter-day Saint temples from South America and around the world, featuring images from Chile, Argentina, Peru, and Utah.">
    <meta name="author" content="Ilich Chang Vasquez" />
    <title>Temple Album</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temple-large.css" media="(min-width: 600px)">
    <script src="scripts/temples.js" defer></script>
</head>

<body>

    <header>
        <h2>Temple Album</h2>
        <button id="menu"></button>
        <nav class="navigation">
            <a href="#">Home</a>
            <a href="#">Old</a>
            <a href="#">New</a>
            <a href="#">Large</a>
            <a href="#">Small</a>
        </nav>
    </header>

    <main>
        <h1>Home</h1>
        <div class="gallery">
            <figure>
                <img src="images/santiago_chile.jpeg" alt="Santiago Temple" loading="lazy">
                <figcaption>Santiago, Chile</figcaption>
            </figure>

            <figure>
                <img src="images/concepcion_chile.jpeg" alt="Conception Temple" loading="lazy">
                <figcaption>Concepcion, Chile</figcaption>
            </figure>

            <figure>
                <img src="images/antofagasta_chile.jpeg" alt="Antofagasta Temple" loading="lazy">
                <figcaption>Antofagasta, Chile</figcaption>
            </figure>

            <figure>
                <img src="images/cordoba_argentina.jpeg" alt="Cordoba Temple" loading="lazy">
                <figcaption>Cordoba, Argentina</figcaption>
            </figure>

            <figure>
                <img src="images/lima_peru_los_olivos.jpeg" alt="Los Olivos Temple" loading="lazy">
                <figcaption>Los Olivos Temple, Peru</figcaption>
            </figure>

            <figure>
                <img src="images/mendoza_argentina.jpeg" alt="Mendoza Temple" loading="lazy">
                <figcaption>Mendoza, Argentina</figcaption>
            </figure>

            <figure>
                <img src="images/salta_argentina.jpeg" alt="Salta Temple" loading="lazy">
                <figcaption>Salta, Argentina</figcaption>
            </figure>

            <figure>
                <img src="images/trujillo_peru.jpeg" alt="Trujillo Temple" loading="lazy">
                <figcaption>Trujillo, Peru</figcaption>
            </figure>

            <figure>
                <img src="images/temple_provo_utah.jpeg" alt="Provo Temple" loading="lazy">
                <figcaption>Provo, Utah</figcaption>
            </figure>

        </div>
    </main>

    <footer>
        <p>
            &copy;<span id="currentyear"></span>
            ⚽ Ilich Chang ⚽ Viña del Mar, Chile
        </p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
