<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product | Oruguitas Deco</title>
    <meta name="description" content="Explora nuestra colección de regalos personalizados: poleras, polerones, agendas, tazones, cuadros y artículos corporativos.">
    <meta name="author" content="Ilich Chang">
    <link rel="stylesheet" href="styles/style.css">
    <script src="scripts/main.js" defer></script>

<body>
    <header>
        <div class="logo-container">

        </div>
        <button id="menu-button" aria-label="Abrir menú">

        <nav id="navigation">

            <h2>Our Products</h2>

                Browse our collection of personalized gifts and custom products.
