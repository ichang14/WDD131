<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Images</title>
    <link rel="stylesheet" href="styles/place.css">
</head>
<body>
    <header>
        <h1>Responsive Images Example</h1>
    </header>
    <main>
        <picture>            
            <source media="(min-width: 1000px)" srcset="images/santiago_chile_webp.webp" type="image/webp">

            <source media="(min-width: 600px)" srcset="images/santiago_chile_webp.webp" type="image/webp">

            <source media="(max-width: 599px)" srcset="images/santiago_chile_webp.webp" type="image/webp">

            <img src="images/santiago_chile_webp.webp" alt="Beautiful landscape" loading="lazy">
        </picture>

        <section>
            <h2>About This Project</h2>
            <p>                This page demonstrates responsive images using
                the picture element and WEBP format.
            </p>
        </section>
    </main>
</body>
</html>
